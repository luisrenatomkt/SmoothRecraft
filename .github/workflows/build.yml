name: Build SmoothRecraft

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Baixar Gradle 2.14.1 (exigido pelo ForgeGradle 2.1)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Compilar
        run: |
          gradle --no-daemon setupCIWorkspace
          gradle --no-daemon build

      - name: Publicar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: SmoothRecraft-1.8.9
          path: build/libs/SmoothRecraft-1.8.9.jar
          if-no-files-found: error
